<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>培训项目驾驶舱</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">T</span><div><strong>培训运营</strong><small>项目驾驶舱</small></div></div>
      <nav>
        <button class="nav-item active" data-view="dashboard"><span>▦</span>项目总览</button>
        <button class="nav-item" data-view="create"><span>＋</span>创建项目</button>
        <button class="nav-item" data-view="timeline"><span>◷</span>节点任务</button>
      </nav>
      <div class="sidebar-foot"><span class="online-dot"></span>单机模式<br><small>数据仅保存在本机</small></div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div><p class="eyebrow">TRAINING OPERATION COPILOT</p><h1>项目管理工作台</h1><p class="welcome">清晰掌握每个节点，让交付进度始终可控。</p></div>
        <button id="quick-create" class="primary-button">＋ 新建项目</button>
      </header>

      <p id="global-message" class="global-message" aria-live="polite"></p>

      <section id="create-section" class="panel create-section" hidden>
        <div class="panel-title"><div><span class="section-kicker">NEW PROJECT</span><h2>创建培训项目</h2></div><button id="close-create" class="icon-button">×</button></div>
        <form id="project-form" class="project-form">
          <label>项目名称<input id="name" required maxlength="200" placeholder="例如：AI 领导力线下培训"></label>
          <label>项目模板<select id="template" required></select></label>
          <label>项目启动日期<input id="start-date" type="date" required></label>
          <label>培训举办日期<input id="event-date" type="date" required></label>
          <button type="submit" class="primary-button">创建并生成节点</button>
        </form>
      </section>

      <section class="metrics-grid">
        <article class="metric-card accent"><span>总体完成率</span><strong id="completion-rate">0%</strong><div class="progress-track"><i id="progress-bar"></i></div><small id="progress-caption">尚未选择项目</small></article>
        <article class="metric-card"><span>已完成任务</span><div><strong id="done-count">0</strong><b class="metric-icon done">✓</b></div><small>已按计划交付</small></article>
        <article class="metric-card"><span>待完成任务</span><div><strong id="todo-count">0</strong><b class="metric-icon todo">↗</b></div><small id="overdue-caption">0 项已逾期</small></article>
        <article class="metric-card"><span>关键节点</span><div><strong id="milestone-count">0</strong><b class="metric-icon node">◆</b></div><small id="next-milestone">暂无节点</small></article>
      </section>

      <section class="dashboard-grid">
        <section class="panel projects-panel">
          <div class="panel-title"><div><span class="section-kicker">PROJECTS</span><h2>我的项目</h2></div><span id="project-total" class="count-badge">0</span></div>
          <div id="project-list" class="project-list"></div>
        </section>

        <section class="panel calendar-panel">
          <div class="calendar-head"><div><span class="section-kicker">MILESTONE CALENDAR</span><h2 id="calendar-title">节点日历</h2></div><div class="calendar-actions"><button id="prev-month" class="icon-button">‹</button><button id="today-button" class="text-button">今天</button><button id="next-month" class="icon-button">›</button></div></div>
          <div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
          <div id="calendar-grid" class="calendar-grid"></div>
          <div class="calendar-legend"><span><i class="legend-dot milestone-dot"></i>节点</span><span><i class="legend-dot task-dot"></i>任务</span><span><i class="legend-dot done-dot"></i>已完成</span></div>
        </section>

        <aside class="panel day-panel">
          <div class="panel-title"><div><span class="section-kicker">DAY FOCUS</span><h2 id="selected-date-title">选择日期</h2></div></div>
          <div id="day-items" class="day-items"><div class="empty-mini">点击日历中的日期<br>查看当天节点与任务</div></div>
        </aside>
      </section>

      <section id="project-detail" class="panel detail-panel" hidden>
        <div class="detail-header">
          <div><span class="section-kicker">PROJECT TIMELINE</span><h2 id="detail-name"></h2><p id="detail-meta"></p></div>
          <button id="show-add-milestone" class="outline-button">＋ 增加关键节点</button>
        </div>
        <form id="milestone-form" class="milestone-form" hidden>
          <label>节点名称<input name="name" maxlength="200" required></label><label>节点日期<input name="deadline" type="date" required></label>
          <label class="check-label"><input name="required" type="checkbox">设为关键节点</label><button type="submit" class="primary-button">保存</button><button id="cancel-add-milestone" type="button" class="text-button">取消</button>
        </form>
        <div id="timeline" class="timeline"></div>
      </section>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
